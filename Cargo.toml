[package]
name = "mqtt-sniper"
version = "1.2.0"
edition = "2024"
authors = ["Thitipong Roongprasert <thitipong.roo@gmail.com>"]
description = "A blazing-fast, memory-efficient MQTT load testing CLI written in Rust using the Tokio async runtime."
repository = "https://github.com/thitipongroo/mqtt-sniper"
homepage = "https://github.com/thitipongroo/mqtt-sniper"
readme = "README.md"
license = "MIT"
keywords = ["mqtt", "iot", "load-testing", "benchmark", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
tokio = { version = "1.34", features = ["full"] }
rumqttc = "0.24.0"
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
hdrhistogram = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"

[target.'cfg(unix)'.dependencies]
rlimit = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "histogram_merge"
harness = false
